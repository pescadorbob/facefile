version: 1
backend:
  phases:
    build:
      commands:
        - cd amplify && npm install && cd ..
        # Not `npx ampx ...` — there's no package literally named `ampx` on
        # the registry for npx to fall back to once it isn't found locally,
        # and ampx only exists inside amplify/node_modules (the CLI deps
        # live scoped to amplify/, not a root-level package.json). Invoking
        # the installed binary directly avoids that resolution failure.
        - amplify/node_modules/.bin/ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # amplify_outputs.json is written to the repo root by the backend
        # phase above; frontend/public/* ships as static assets (see
        # angular.json's assets glob), so this is how the deployed app
        # learns its API endpoint at runtime — see
        # frontend/src/app/services/api-config.service.ts.
        - cp amplify_outputs.json frontend/public/amplify_outputs.json
        - cd frontend && npm install
    build:
      commands:
        # cd again rather than relying on preBuild's cwd carrying into this
        # phase — Amplify Hosting doesn't guarantee that across phases.
        - cd frontend && npm run build
  artifacts:
    baseDirectory: frontend/dist/frontend/browser
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
