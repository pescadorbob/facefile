version: 1
backend:
  phases:
    build:
      commands:
        # The Amplify CLI and CDK deps live in the root package.json, so both
        # of these run from the repo root — `amplify/package.json` is only the
        # `{"type": "module"}` marker and has no deps of its own to install.
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # amplify_outputs.json is written to the repo root by the backend
        # phase above; frontend/public/* ships as static assets (see
        # angular.json's assets glob), so this is how the deployed app
        # learns its API endpoint at runtime — see
        # frontend/src/app/services/api-config.service.ts.
        - cp amplify_outputs.json frontend/public/amplify_outputs.json
        # `npm --prefix` rather than `cd frontend &&` — Amplify runs every
        # phase in one shell session, so a `cd` leaks into later phases and
        # the next relative `cd frontend` then resolves to frontend/frontend.
        # npm still runs the script with cwd set to frontend/, so `ng` finds
        # angular.json. Every path here stays relative to the repo root.
        - npm --prefix frontend install
    build:
      commands:
        - npm --prefix frontend run build
  artifacts:
    baseDirectory: frontend/dist/frontend/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - frontend/node_modules/**/*
